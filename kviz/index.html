<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kvíz na TV – IT Herna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--acc:#ffd200;--acc2:#f7971e}
body::before{background:radial-gradient(60vw 60vw at 5% -10%,rgba(255,210,0,.14),transparent 60%),radial-gradient(50vw 50vw at 105% 110%,rgba(247,151,30,.14),transparent 60%)}
.host{max-width:1400px;margin:0 auto;padding:26px}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.qrb{background:#fff;border-radius:26px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#1a1a2e;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
.qrb .code{font:900 54px 'JetBrains Mono',monospace;letter-spacing:.15em}
.qrb small{font-size:15px;color:#555a78;font-weight:600}
h1.big{font-size:clamp(40px,5vw,76px);font-weight:900;letter-spacing:-.04em;line-height:1;margin:0 0 14px}
.players{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.pl{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:19px;animation:hin .3s}
.pl span{font-size:26px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}
.qnum{font:800 18px 'JetBrains Mono',monospace;color:var(--mut)}
.qtext{font-size:clamp(30px,4vw,56px);font-weight:900;letter-spacing:-.02em;line-height:1.15;margin:0 0 26px;text-align:center}
.clock{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font:900 42px 'JetBrains Mono',monospace;background:conic-gradient(var(--acc) var(--p,100%),var(--line) 0);position:relative}
.clock::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.clock b{position:relative}
.ansn{font-weight:800;font-size:20px;color:var(--mut);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.op{display:flex;align-items:center;gap:16px;padding:24px 26px;border-radius:20px;font-size:clamp(20px,2.4vw,32px);font-weight:800;color:#fff;min-height:110px;transition:.3s;position:relative;overflow:hidden}
.op .sh{font-size:40px}
.op .cnt{margin-left:auto;font:900 28px 'JetBrains Mono',monospace;opacity:0}
.reveal .op .cnt{opacity:1}
.reveal .op:not(.right){opacity:.35;filter:grayscale(.6)}
.reveal .op.right{box-shadow:0 0 0 6px #fff,0 20px 50px -10px rgba(255,255,255,.4);transform:scale(1.03)}
.c0{background:linear-gradient(135deg,#e11d48,#ff5e62)}.c1{background:linear-gradient(135deg,#2563eb,#00a8ff)}.c2{background:linear-gradient(135deg,#d97706,#ffd200)}.c3{background:linear-gradient(135deg,#16a34a,#38ef7d)}
.board{display:flex;flex-direction:column;gap:10px;max-width:820px;margin:20px auto}
.br{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:24px;font-weight:800;animation:hin .4s both}
.br .rk{width:44px;font-size:28px;text-align:center}
.br .pt{margin-left:auto;font-family:'JetBrains Mono',monospace}
.br .plus{color:var(--ok);font-size:17px;margin-left:10px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin:30px 0}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px;animation:hin .6s both}
.pod .av{font-size:64px}
.pod b{font-size:26px}
.pod .blk{width:200px;border-radius:18px 18px 0 0;display:grid;place-items:center;font:900 54px 'JetBrains Mono',monospace;color:#1a1a2e}
.center{text-align:center}
/* hráč (mobil) */
.phone{max-width:520px;margin:0 auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));min-height:calc(100vh - 70px);display:flex;flex-direction:column;gap:16px;justify-content:center}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emos button{aspect-ratio:1/1;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:28px;padding:0}
.emos button.sel{border-color:var(--acc);background:rgba(255,210,0,.15)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;max-height:70vh}
.pbtns button{border:0;border-radius:22px;color:#fff;font-weight:800;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;min-height:140px}
.pbtns button .sh{font-size:46px}
.pbtns button:active{transform:scale(.96)}
.state{text-align:center;font-size:24px;font-weight:800;line-height:1.4}
.state .e{font-size:80px;display:block;margin-bottom:10px}
@media (max-width:900px){.lobby{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/qrcode.js"></script>
<script src="../shared/common.js"></script>
<script>
const H = Herna, $ = H.$;
// ====== Supabase Realtime (jen zprávy, nic se neukládá) ======
const SB_URL = 'https://jktznzuupkdelifferje.supabase.co';
const SB_KEY = 'sb_publishable_52McoPP1Bast6vXogEbjzg_VYnEKIqK';

const isPlayer = location.hash.startsWith('#hrac-');
H.init({emoji:'🎯', title: isPlayer ? 'Kvíz' : 'Kvíz na TV', idle:false});
const SHAPES = ['🔺', '🔷', '🟡', '🟩'];
const QS = [
  {q:'Co znamená zkratka WWW?', o:['World Wide Web', 'Wide World Wi-Fi', 'Web World Wide', 'Windows Web Works'], a:0},
  {q:'Které heslo je nejbezpečnější?', o:['123456', 'heslo123', 'Pes2010', 'ModryKoleckoJiDolu7!'], a:3},
  {q:'Kolik bitů má jeden bajt?', o:['4', '8', '16', '10'], a:1},
  {q:'Který jazyk určuje VZHLED webu (barvy, písmo)?', o:['HTML', 'CSS', 'SQL', 'Python'], a:1},
  {q:'Co je phishing?', o:['Rybaření s počítačem', 'Podvodný e-mail, který chce tvoje údaje', 'Virus v Minecraftu', 'Rychlé připojení k internetu'], a:1},
  {q:'Která součástka je „mozek“ počítače?', o:['Grafická karta', 'RAM', 'Procesor (CPU)', 'Disk SSD'], a:2},
  {q:'Jak programátoři říkají chybě v programu?', o:['Bug 🐛', 'Fix', 'Patch', 'Boot'], a:0},
  {q:'Kudy vede většina internetu mezi kontinenty?', o:['Přes satelity', 'Kabely po dně oceánu', 'Mobilní věže', 'Wi-Fi'], a:1},
  {q:'Kolik je ve dvojkové soustavě 101?', o:['3', '5', '101', '7'], a:1},
  {q:'Kde se naučíš stavět weby, sítě a chránit data?', o:['Na kurzu vaření', 'Na oboru IT na 1. KŠPA 😉', 'V autoškole', 'Na kroužku keramiky'], a:1}
];
const QT = 20; // sekund na otázku
let sb = null, ch = null;
function connect(code, onReady){
  if (!window.supabase || !SB_KEY){ fail('Chybí připojení ke kvízovému serveru.'); return; }
  sb = supabase.createClient(SB_URL, SB_KEY, {realtime: {params: {eventsPerSecond: 30}}});
  ch = sb.channel('kviz-' + code, {config: {broadcast: {self: false}}});
  onReady(ch);
  let ok = false;
  ch.subscribe(st => { if (st === 'SUBSCRIBED' && !ok){ ok = true; ch.ready && ch.ready(); } if ((st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') && !ok) fail('Nepodařilo se připojit. Zkontroluj internet a zkus to znovu.'); });
}
const send = (event, payload) => ch && ch.send({type: 'broadcast', event, payload});
function fail(t){ $('#app').innerHTML = `<div class="phone"><div class="state"><span class="e">📡</span>${t}</div><button class="btn-p" onclick="location.reload()">Zkusit znovu</button></div>`; }

/* ================= HOST (TV) ================= */
let code = '', players = {}, phase = 'lobby', qi = -1, answers = {}, qStart = 0, tInt = 0, lastGain = {};
function hostInit(){
  code = Array.from({length: 4}, () => 'ABCDEFGHJKLMNPRSTUVZ'[Math.floor(Math.random() * 20)]).join('');
  connect(code, c => {
    c.on('broadcast', {event: 'join'}, ({payload: p}) => {
      if (!p || !p.id) return; const fresh = !players[p.id];
      players[p.id] = players[p.id] || {name: String(p.name || 'Hráč').slice(0, 16), emo: String(p.emo || '🙂').slice(0, 4), score: 0};
      if (fresh){ H.sfx('pop'); if (phase === 'lobby') lobby(); }
      sync();
    });
    c.on('broadcast', {event: 'ans'}, ({payload: p}) => {
      if (phase !== 'q' || !p || p.q !== qi || !players[p.id] || answers[p.id]) return;
      answers[p.id] = {a: +p.a, t: Date.now() - qStart}; H.tone(900, 0, .04, 'sine', .04);
      const n = $('#ansn'); if (n) n.textContent = `${Object.keys(answers).length} / ${Object.keys(players).length} odpovědí`;
      if (Object.keys(answers).length >= Object.keys(players).length) reveal();
    });
    c.ready = () => lobby();
  });
}
function joinUrl(){ return H.base() + '#hrac-' + code; }
function lobby(){
  phase = 'lobby'; const ps = Object.values(players);
  $('#app').innerHTML = `<div class="host"><div class="lobby">
    <div class="qrb">${H.qr(joinUrl(), 300, 'M')}<small>nebo otevři <b>${location.host}${location.pathname}</b> a zadej kód</small><div class="code">${code}</div></div>
    <div><div class="kicker">IT Herna · 1. KŠPA Litoměřice</div><h1 class="big">🎯 Kvíz pro <span class="grad">celou partu</span></h1>
      <p class="info" style="font-size:20px">Naskenujte QR kód mobilem, napište přezdívku a jste ve hře. ${QS.length} otázek o IT, za rychlou správnou odpověď víc bodů!</p>
      <div class="players">${ps.length ? ps.map(p => `<div class="pl"><span>${H.esc(p.emo)}</span>${H.esc(p.name)}</div>`).join('') : '<div class="info">Čekám na hráče… 📱</div>'}</div>
      <button class="btn-p" style="font-size:24px;padding:20px 40px" ${ps.length ? '' : 'disabled'} onclick="nextQ()">▶ Spustit kvíz (${ps.length} ${ps.length === 1 ? 'hráč' : ps.length < 5 ? 'hráči' : 'hráčů'})</button>
    </div></div></div>`;
}
function sync(){
  const base = {phase, code};
  if (phase === 'q') Object.assign(base, {qi, n: QS.length, q: QS[qi].q, o: QS[qi].o, left: Math.max(0, QT - (Date.now() - qStart) / 1000)});
  if (phase === 'reveal' || phase === 'end'){
    const rank = ranked();
    base.res = {}; rank.forEach((p, i) => base.res[p.id] = {rank: i + 1, score: p.score, gain: lastGain[p.id] || 0, ok: phase === 'reveal' ? (answers[p.id] && answers[p.id].a === QS[qi].a) : null});
    base.n = QS.length; base.qi = qi; base.right = phase === 'reveal' ? QS[qi].o[QS[qi].a] : null;
  }
  send('state', base);
}
function ranked(){ return Object.entries(players).map(([id, p]) => ({id, ...p})).sort((a, b) => b.score - a.score); }
function nextQ(){
  qi++; if (qi >= QS.length){ end(); return; }
  phase = 'q'; answers = {}; qStart = Date.now(); const Q = QS[qi];
  $('#app').innerHTML = `<div class="host">
    <div class="qhead"><div class="qnum">Otázka ${qi + 1} / ${QS.length}</div><div class="clock" id="clk"><b id="cl">${QT}</b></div><div class="ansn" id="ansn">0 / ${Object.keys(players).length} odpovědí</div></div>
    <h2 class="qtext">${H.esc(Q.q)}</h2>
    <div class="opts" id="opts">${Q.o.map((o, i) => `<div class="op c${i}" id="op${i}"><span class="sh">${SHAPES[i]}</span>${H.esc(o)}<span class="cnt" id="cnt${i}">0</span></div>`).join('')}</div></div>`;
  H.sfx('whoosh'); H.speak(Q.q); sync();
  clearInterval(tInt);
  tInt = setInterval(() => {
    const left = QT - (Date.now() - qStart) / 1000;
    if ($('#cl')){ $('#cl').textContent = Math.max(0, Math.ceil(left)); $('#clk').style.setProperty('--p', Math.max(0, left / QT * 100) + '%'); }
    if (left <= 5 && left > 0 && Math.ceil(left) !== tInt.last){ tInt.last = Math.ceil(left); H.tone(660, 0, .06, 'square', .04); }
    if (left <= 0) reveal();
  }, 200);
}
function reveal(){
  if (phase !== 'q') return; clearInterval(tInt); phase = 'reveal'; const Q = QS[qi]; lastGain = {};
  Object.entries(answers).forEach(([id, a]) => { if (a.a === Q.a){ const g = Math.round(1000 * (1 - Math.min(a.t / 1000, QT) / QT / 2)); players[id].score += g; lastGain[id] = g; } });
  const cnt = [0, 0, 0, 0]; Object.values(answers).forEach(a => cnt[a.a]++);
  $('#opts').parentElement.classList.add('reveal'); $('#op' + Q.a).classList.add('right'); cnt.forEach((c, i) => $('#cnt' + i).textContent = c);
  H.sfx('win'); sync();
  setTimeout(() => showBoard(), 3500);
}
function showBoard(){
  const r = ranked().slice(0, 6), last = qi === QS.length - 1;
  $('#app').innerHTML = `<div class="host center"><div class="kicker">Po otázce ${qi + 1} / ${QS.length}</div><h1 class="big" style="margin-top:10px">🏆 Průběžné pořadí</h1>
    <div class="board">${r.map((p, i) => `<div class="br" style="animation-delay:${i * .08}s"><span class="rk">${['🥇', '🥈', '🥉'][i] || i + 1 + '.'}</span><span style="font-size:30px">${H.esc(p.emo)}</span>${H.esc(p.name)}<span class="pt">${p.score}</span>${lastGain[p.id] ? `<span class="plus">+${lastGain[p.id]}</span>` : ''}</div>`).join('')}</div>
    <button class="btn-p" style="font-size:22px;padding:18px 36px" onclick="nextQ()">${last ? '🏁 Vyhlásit výsledky' : 'Další otázka →'}</button></div>`;
}
function end(){
  phase = 'end'; const r = ranked(), cols = ['#ffd200', '#cfd3f5', '#ff9f43'], h = [240, 180, 130], order = [1, 0, 2];
  $('#app').innerHTML = `<div class="host center"><h1 class="big">🎉 Vítězové kvízu!</h1>
    <div class="podium">${order.filter(i => r[i]).map(i => `<div class="pod" style="animation-delay:${(2 - i) * .4}s"><span class="av">${H.esc(r[i].emo)}</span><b>${H.esc(r[i].name)}</b><span class="mono">${r[i].score} b.</span><div class="blk" style="height:${h[i]}px;background:${cols[i]}">${i + 1}</div></div>`).join('')}</div>
    <p class="info" style="font-size:20px">Díky za hru! Tohle všechno (a mnohem víc) se naučíš na oboru <b>IT na 1. KŠPA Litoměřice</b>.</p>
    <button class="btn-p" style="font-size:20px" onclick="location.reload()">↺ Nová hra</button> <a class="btn-s" href="../" style="text-decoration:none;display:inline-block">← Herna</a></div>`;
  H.sfx('win'); H.confetti(innerWidth / 2, innerHeight / 3, 220); if (r[0]) H.speak(`Vítězem je ${r[0].name}! Gratulujeme.`); sync();
}

/* ================= HRÁČ (mobil) ================= */
let me = {id: '', name: '', emo: '😎'}, pState = null, answered = -1;
try { me.id = sessionStorage.getItem('kviz-id') || ''; } catch(e){}
if (!me.id){ me.id = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('kviz-id', me.id); } catch(e){} }
const EMOS = ['😎', '🦄', '🐱', '🐶', '🦊', '🐸', '👾', '🤖', '🐼', '🦖', '🐙', '🔥'];
function playerInit(){
  const c = location.hash.slice(6).toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  $('#app').innerHTML = `<div class="phone">
    <div class="state" style="font-size:20px"><span class="e" style="font-size:60px">🎯</span>Kvíz IT Herny</div>
    <div><label class="lbl">Kód hry</label><input class="txt mono" id="cd" maxlength="4" value="${c}" style="text-transform:uppercase;font-size:24px;letter-spacing:.2em;text-align:center"></div>
    <div><label class="lbl">Tvoje přezdívka</label><input class="txt" id="nm" maxlength="16" placeholder="např. Hacker007"></div>
    <div><label class="lbl">Avatar</label><div class="emos">${EMOS.map(e => `<button class="${e === me.emo ? 'sel' : ''}" onclick="me.emo='${e}';document.querySelectorAll('.emos button').forEach(b=>b.classList.toggle('sel',b.textContent==='${e}'))">${e}</button>`).join('')}</div></div>
    <button class="btn-p" style="font-size:20px;padding:18px" onclick="join()">Hrát! 🚀</button></div>`;
}
function join(){
  me.name = $('#nm').value.trim() || 'Hráč'; const c = $('#cd').value.toUpperCase().trim();
  if (c.length !== 4){ H.toast('Zadej 4písmenný kód z televize'); return; }
  pScreen('⏳', 'Připojuji…');
  connect(c, ch => {
    ch.on('broadcast', {event: 'state'}, ({payload: s}) => onState(s));
    ch.ready = () => { send('join', me); pScreen('✅', `Jsi ve hře, ${H.esc(me.emo)} ${H.esc(me.name)}!<br><small style="color:var(--mut);font-weight:600">Sleduj televizi, kvíz brzy začne.</small>`); setInterval(() => { if (!pState || pState.phase === 'lobby') send('join', me); }, 4000); };
  });
}
function pScreen(e, t){ $('#app').innerHTML = `<div class="phone"><div class="state"><span class="e">${e}</span>${t}</div></div>`; }
function onState(s){
  pState = s;
  if (s.phase === 'lobby') return;
  if (s.phase === 'q'){
    if (answered === s.qi) return;
    $('#app').innerHTML = `<div class="phone"><div class="kicker" style="text-align:center">Otázka ${s.qi + 1} / ${s.n}</div><div style="text-align:center;font-weight:800;font-size:19px">${H.esc(s.q)}</div>
      <div class="pbtns">${s.o.map((o, i) => `<button class="c${i}" onclick="pick(${i})"><span class="sh">${SHAPES[i]}</span>${H.esc(o)}</button>`).join('')}</div></div>`;
    if (navigator.vibrate) navigator.vibrate(60);
  }
  if (s.phase === 'reveal' || s.phase === 'end'){
    const r = s.res && s.res[me.id];
    if (!r){ send('join', me); pScreen('👀', 'Připojuji tě do hry…'); return; }
    if (s.phase === 'reveal') pScreen(r.ok ? '🎉' : '😬', r.ok ? `Správně! +${r.gain} bodů` : `Vedle!<br><small style="color:var(--mut)">Správně bylo: ${H.esc(s.right)}</small>`) ;
    else pScreen(r.rank === 1 ? '🏆' : r.rank <= 3 ? '🥉' : '👏', `Konec hry!<br>Jsi <b>${r.rank}.</b> s ${r.score} body`);
    $('#app .phone').insertAdjacentHTML('beforeend', `<div class="center" style="font:800 18px 'JetBrains Mono',monospace;color:var(--mut)">${r.score} bodů · ${r.rank}. místo</div>`);
    if (s.phase === 'end' && r.rank <= 3) H.confetti(innerWidth / 2, innerHeight / 3, 120);
    if (navigator.vibrate) navigator.vibrate(r.ok ? [60, 40, 60] : 200);
  }
}
function pick(i){
  if (!pState || pState.phase !== 'q') return; answered = pState.qi;
  send('ans', {id: me.id, q: pState.qi, a: i}); H.sfx('pop');
  pScreen(SHAPES[i], 'Odesláno! ✓<br><small style="color:var(--mut);font-weight:600">Počkej na ostatní…</small>');
}

if (isPlayer) playerInit(); else hostInit();
</script>
</body>
</html>
