<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kóduj hudbu – IT Herna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/common.css">
<style>
:root{--acc:#a855f7;--acc2:#6366f1}
body::before{background:radial-gradient(60vw 60vw at 5% -10%,rgba(168,85,247,.18),transparent 60%),radial-gradient(50vw 50vw at 105% 110%,rgba(99,102,241,.14),transparent 60%)}
.wrap{max-width:1320px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.play{width:70px;height:70px;border-radius:50%;border:0;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 30px -8px var(--acc)}
.play.on{animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 10px rgba(168,85,247,.2),0 12px 30px -8px var(--acc)}}
.tempo{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800}
.tempo input{accent-color:var(--acc);width:150px}
.chip{padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:14.5px}
.chip.sel{border-color:var(--acc);background:rgba(168,85,247,.15)}
.seq{background:#0b0c16;border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;user-select:none;touch-action:none}
.row{display:grid;grid-template-columns:110px repeat(16,1fr);gap:5px;align-items:center}
.row .rl{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.row .rl span{font-size:20px}
.c{aspect-ratio:1/1;border-radius:8px;background:#1b1d30;cursor:pointer;transition:background .08s,transform .08s}
.c:nth-child(4n+2){margin-left:0}
.row .c:nth-of-type(4n+1){box-shadow:inset 2px 0 0 #2e3150}
.c.on{background:var(--rc);box-shadow:0 0 12px var(--rc)}
.c.ph{outline:2px solid #fff;outline-offset:-2px}
.c.on.ph{transform:scale(1.15)}
.sep{height:6px}
.mrow .c.on{background:var(--rc)}
.vis{display:flex;justify-content:space-around;align-items:flex-end;height:90px;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;font-size:40px}
.vis span{transition:transform .08s}
.side{display:flex;flex-direction:column;gap:14px}
.code{background:#0b0c16;border:1px solid var(--line);border-radius:16px;padding:14px;font:12.5px/1.6 'JetBrains Mono',monospace;color:#c9cdf0;white-space:pre;overflow:auto;max-height:340px}
.code .kw{color:#bd93f9}.code .st{color:#f1fa8c}.code .nm{color:#8be9fd}.code .cm{color:#6c76a8}
.qr{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#1a1a2e;text-align:center}
.qr b{font-size:17px}.qr span{font-size:13px;color:#555a78}
.viewer{max-width:640px;margin:40px auto;text-align:center;padding:20px}
.viewer .play{width:120px;height:120px;font-size:50px}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.row{grid-template-columns:70px repeat(16,1fr)}.row .rl b{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/qrcode.js"></script>
<script src="../shared/common.js"></script>
<script>
const H = Herna, $ = H.$;
const viewer = location.hash.startsWith('#m-');
H.init({emoji:'🎵', title:'Kóduj hudbu', idle: !viewer});

const DR = [{e:'🥁', n:'Kopák', id:'kick', c:'#ff5e62'}, {e:'👏', n:'Tlesk', id:'clap', c:'#ffb020'}, {e:'🎩', n:'Činel', id:'hat', c:'#22c55e'}];
const NOTES = [{n:'E5', f:659.3}, {n:'D5', f:587.3}, {n:'C5', f:523.3}, {n:'A4', f:440}, {n:'G4', f:392}, {n:'E4', f:329.6}, {n:'D4', f:293.7}, {n:'C4', f:261.6}];
const INST = {piano:{l:'🎹 Piano', t:'triangle'}, bit:{l:'🎮 8-bit', t:'square'}, synth:{l:'🌊 Synťák', t:'sawtooth'}};
const ROWS = DR.length + NOTES.length;
let G = Array.from({length: ROWS}, () => new Array(16).fill(0)), bpm = 110, inst = 'piano', playing = false, step = 0, nextT = 0, timer = 0;

const PRESETS = {
  hiphop:{bpm:90, g:['x...x...x.x.x...', '....x.......x...', 'x.x.x.x.x.x.x.xx', '', '', '', '........x.......', 'x.....x.....x...', '', '...x.......x....', '']},
  disco:{bpm:122, g:['x...x...x...x...', '....x.......x...', '..x...x...x...x.', 'x.......x.......', '..x.......x.....', '....x.......x...', '......x.......x.', '', '', '', '']},
  retro:{bpm:140, g:['x.......x.......', '....x.......x...', 'x.x.x.x.x.x.x.x.', '', 'x...x.......x...', '..x.......x.....', '......x.x.......', '..............x.', 'x...............', '', '']}
};
function loadPreset(k){
  const p = PRESETS[k]; bpm = p.bpm;
  G = Array.from({length: ROWS}, (_, r) => [...(p.g[r] || '').padEnd(16, '.')].map(ch => ch === 'x' ? 1 : 0));
  render(); H.sfx('pop');
}
function randomize(){
  G = G.map((row, r) => row.map((_, i) => r === 0 ? (i % 4 === 0 || Math.random() < .1 ? 1 : 0) : r === 1 ? (i % 8 === 4 ? 1 : 0) : r === 2 ? (i % 2 === 0 ? 1 : 0) : Math.random() < .07 ? 1 : 0));
  render(); H.sfx('pop');
}

/* ---------- zvuky ---------- */
let noiseBuf = null;
function noise(a){ if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } const s = a.createBufferSource(); s.buffer = noiseBuf; return s; }
function play(r, t){
  const a = H.ac(); if (!a || H.muted) return;
  const g = a.createGain(); g.connect(a.destination);
  if (r === 0){ const o = a.createOscillator(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + .25); g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g); o.start(t); o.stop(t + .4); }
  else if (r === 1){ const n = noise(a), f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500; n.connect(f).connect(g); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .18); n.start(t); n.stop(t + .2); }
  else if (r === 2){ const n = noise(a), f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000; n.connect(f).connect(g); g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .05); n.start(t); n.stop(t + .07); }
  else {
    const o = a.createOscillator(), f = a.createBiquadFilter(), d = 60 / bpm / 4 * 1.8;
    o.type = INST[inst].t; o.frequency.value = NOTES[r - DR.length].f; f.type = 'lowpass'; f.frequency.value = inst === 'synth' ? 1800 : 5000;
    o.connect(f).connect(g); const v = inst === 'piano' ? .22 : .09;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d); o.start(t); o.stop(t + d + .05);
  }
}
function tick(){
  const a = H.ac(); if (!a) return;
  while (nextT < a.currentTime + .12){
    const s = step, when = nextT;
    for (let r = 0; r < ROWS; r++) if (G[r][s]) play(r, when);
    setTimeout(() => showStep(s), Math.max(0, (when - a.currentTime) * 1000));
    nextT += 60 / bpm / 4; step = (step + 1) % 16;
  }
}
function showStep(s){
  document.querySelectorAll('.c.ph').forEach(c => c.classList.remove('ph'));
  document.querySelectorAll(`.c[data-s="${s}"]`).forEach(c => c.classList.add('ph'));
  const v = $('#vis'); if (!v) return;
  [...v.children].forEach((sp, i) => {
    const hit = i < 3 ? G[i][s] : G.slice(3).some(r => r[s]);
    sp.style.transform = hit ? `translateY(-${i === 0 ? 30 : 20}px) scale(1.3)` : '';
  });
}
function toggle(){
  const a = H.ac(); if (!a) return;
  playing = !playing;
  if (playing){ step = 0; nextT = a.currentTime + .05; timer = setInterval(tick, 25); }
  else { clearInterval(timer); document.querySelectorAll('.c.ph').forEach(c => c.classList.remove('ph')); }
  document.querySelectorAll('.play').forEach(b => { b.classList.toggle('on', playing); b.textContent = playing ? '⏸' : '▶'; });
}

/* ---------- sdílení ---------- */
function enc(){ return '#m-' + bpm + '-' + Object.keys(INST).indexOf(inst) + '-' + G.map(r => parseInt(r.join(''), 2).toString(16).padStart(4, '0')).join(''); }
function dec(h){
  const [, b, i, g] = h.slice(1).split('-'); bpm = Math.min(180, Math.max(60, +b || 110)); inst = Object.keys(INST)[+i] || 'piano';
  G = Array.from({length: ROWS}, (_, r) => [...parseInt((g || '').slice(r * 4, r * 4 + 4) || '0', 16).toString(2).padStart(16, '0')].map(Number));
}

/* ---------- vykreslení ---------- */
function render(){
  if (viewer){ renderViewer(); return; }
  $('#app').innerHTML = `<div class="wrap"><div>
    <div class="ctrl">
      <button class="play ${playing ? 'on' : ''}" onclick="toggle()">${playing ? '⏸' : '▶'}</button>
      <div class="tempo">🐢 <input type="range" min="60" max="180" value="${bpm}" oninput="bpm=+this.value;$('#bv').textContent=bpm;code()"> 🐇 <span class="mono" id="bv">${bpm}</span> BPM</div>
      ${Object.entries(INST).map(([k, v]) => `<button class="chip ${inst === k ? 'sel' : ''}" onclick="inst='${k}';render()">${v.l}</button>`).join('')}
    </div>
    <div class="ctrl">${[['hiphop', '🎧 Hip-hop'], ['disco', '🕺 Disco'], ['retro', '👾 Retro hra']].map(([k, l]) => `<button class="chip" onclick="loadPreset('${k}')">${l}</button>`).join('')}<button class="chip" onclick="randomize()">🎲 Náhodně</button><button class="chip" onclick="G=G.map(r=>r.fill(0));render()">🗑️ Smazat</button></div>
    <div class="seq" id="seq">
      ${DR.map((d, r) => rowHtml(r, `<span>${d.e}</span><b>${d.n}</b>`, d.c)).join('')}
      <div class="sep"></div>
      ${NOTES.map((n, i) => rowHtml(DR.length + i, `<span>🎶</span><b>${n.n}</b>`, `hsl(${280 - i * 22},85%,62%)`)).join('')}
    </div>
    <div class="vis" id="vis"><span>🥁</span><span>👏</span><span>🎩</span><span>🎹</span></div>
  </div>
  <div class="side">
    <div class="panel"><div class="kicker">Jak to funguje</div><p class="info" style="margin:6px 0 0">Každý řádek je jeden nástroj, každý sloupec jedna <b>doba</b>. Počítač projíždí sloupce zleva doprava a hraje, co je rozsvícené. Tomu se říká <b>sekvencer</b>. Ťukej nebo táhni prstem po mřížce.</p></div>
    <div><div class="lbl">Tvoje hudba jako kód</div><div class="code" id="code"></div></div>
    <div class="qr"><b>📱 Odnes si svůj beat</b><div id="qr"></div><span>Naskenuj mobilem a pusť si ho doma.</span></div>
  </div></div>`;
  bindSeq(); code();
}
function rowHtml(r, label, col){ return `<div class="row ${r >= DR.length ? 'mrow' : ''}" style="--rc:${col}"><div class="rl">${label}</div>${G[r].map((v, s) => `<div class="c ${v ? 'on' : ''}" data-r="${r}" data-s="${s}"></div>`).join('')}</div>`; }
let paint = null;
function bindSeq(){
  const seq = $('#seq');
  const cellAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.classList.contains('c') ? el : null; };
  const set = el => { const r = +el.dataset.r, s = +el.dataset.s; if (G[r][s] === paint) return; G[r][s] = paint; el.classList.toggle('on', !!paint); if (paint && !playing) play(r, H.ac().currentTime); code(); };
  seq.onpointerdown = e => { const el = cellAt(e); if (!el) return; paint = G[+el.dataset.r][+el.dataset.s] ? 0 : 1; set(el); seq.setPointerCapture(e.pointerId); };
  seq.onpointermove = e => { if (paint === null) return; const el = cellAt(e); if (el) set(el); };
  seq.onpointerup = seq.onpointercancel = () => paint = null;
}
function code(){
  const pat = r => G[r].map(v => v ? 'x' : '.').join('');
  const mel = []; for (let s = 0; s < 16; s++){ const n = NOTES.filter((_, i) => G[DR.length + i][s]).map(x => x.n); mel.push(n.length ? n.join('+') : '.'); }
  const el = $('#code'); if (!el) return;
  el.innerHTML = `<span class="cm">// tempo a nástroj</span>\n<span class="kw">tempo</span>(<span class="nm">${bpm}</span>)\n<span class="kw">nastroj</span>(<span class="st">"${inst}"</span>)\n\n<span class="cm">// bicí: x = úder, . = ticho</span>\n` +
    DR.map((d, r) => `<span class="kw">beat</span>(<span class="st">"${d.id}"</span>, <span class="st">"${pat(r)}"</span>)`).join('\n') +
    `\n\n<span class="cm">// melodie po dobách</span>\n<span class="kw">melodie</span>([${mel.map(m => m === '.' ? '<span class="cm">.</span>' : `<span class="st">${m}</span>`).join(', ')}])`;
  const q = $('#qr'); if (q){ clearTimeout(code.t); code.t = setTimeout(() => q.innerHTML = H.qr(H.base() + enc(), 170, 'M'), 250); }
}
function renderViewer(){
  $('#app').innerHTML = `<div class="viewer"><div class="kicker">Beat z IT Herny · 1. KŠPA Litoměřice</div><h1 style="font-size:40px;margin:10px 0 20px">🎵 Někdo ti složil beat!</h1>
    <button class="play" onclick="toggle()">▶</button><p class="info">${bpm} BPM · ${INST[inst].l}</p>
    <div class="vis" id="vis"><span>🥁</span><span>👏</span><span>🎩</span><span>🎹</span></div>
    <p style="margin-top:24px"><a class="btn-s" style="text-decoration:none;display:inline-block" href="${H.base()}">🎛️ Složit vlastní</a></p></div>`;
}
if (viewer) dec(location.hash); else loadPreset('hiphop');
render();
if (!viewer) H.speak('Ahoj! Slož si vlastní beat. Ťukej na mřížku a pusť to tlačítkem play.');
</script>
</body>
</html>
